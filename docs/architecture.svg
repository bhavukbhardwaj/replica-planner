<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker></defs>
  <rect width="900" height="430" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold">Replica Planner - architecture</text>

  <rect x="20" y="150" width="120" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="80" y="180" text-anchor="middle" font-weight="bold">Client</text>
  <text x="80" y="200" text-anchor="middle" font-size="12">curl / Postman</text>

  <rect x="200" y="60" width="480" height="340" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="212" y="80" font-size="12" fill="#475569">FastAPI service (pod in kind, namespace "planner")</text>

  <rect x="220" y="95" width="200" height="50" rx="6" fill="#fff" stroke="#334155"/>
  <text x="320" y="116" text-anchor="middle" font-weight="bold">1. Auth + validation</text>
  <text x="320" y="134" text-anchor="middle" font-size="12">X-API-Token, strict schema</text>

  <rect x="460" y="95" width="200" height="50" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="560" y="116" text-anchor="middle" font-weight="bold">2. Agent loop (max 4 turns)</text>
  <text x="560" y="134" text-anchor="middle" font-size="12">validates every model output</text>

  <rect x="460" y="190" width="200" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="560" y="212" text-anchor="middle" font-weight="bold">Read-only tools</text>
  <text x="560" y="230" text-anchor="middle" font-size="12">get_service_state</text>
  <text x="560" y="244" text-anchor="middle" font-size="12">get_deployment_policy</text>

  <rect x="220" y="190" width="200" height="60" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="320" y="212" text-anchor="middle" font-weight="bold">3. Policy engine (code)</text>
  <text x="320" y="230" text-anchor="middle" font-size="12">decision: allowed / requires_approval</text>
  <text x="320" y="244" text-anchor="middle" font-size="12">/ blocked / no_change</text>

  <rect x="220" y="300" width="200" height="60" rx="6" fill="#fff" stroke="#334155"/>
  <text x="320" y="322" text-anchor="middle" font-weight="bold">4. Plan builder (code)</text>
  <text x="320" y="340" text-anchor="middle" font-size="12">artifact, verify + rollback steps</text>
  <text x="320" y="354" text-anchor="middle" font-size="12">applied: false</text>

  <rect x="460" y="300" width="200" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="560" y="322" text-anchor="middle" font-weight="bold">Fixtures (JSON)</text>
  <text x="560" y="340" text-anchor="middle" font-size="12">synthetic state + policy</text>

  <rect x="740" y="95" width="140" height="70" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="810" y="122" text-anchor="middle" font-weight="bold">LLM</text>
  <text x="810" y="141" text-anchor="middle" font-size="12">Ollama (gpt-oss:20b)</text>
  <text x="810" y="156" text-anchor="middle" font-size="12">or fake model</text>

  <g stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M140,185 L220,125"/>
    <path d="M420,120 L460,120"/>
    <path d="M660,115 L740,115"/>
    <path d="M740,140 L670,140" stroke-dasharray="4 3"/>
    <path d="M560,145 L560,190"/>
    <path d="M560,250 L560,300"/>
    <path d="M460,235 L420,225" stroke-dasharray="4 3"/>
    <path d="M320,250 L320,300"/>
    <path d="M220,330 L140,215"/>
  </g>
  <text x="702" y="108" font-size="11" fill="#444">prompt</text>
  <text x="680" y="156" font-size="11" fill="#444">tool calls / answer</text>
  <text x="430" y="272" font-size="11" fill="#444">tool results</text>

  <text x="450" y="418" text-anchor="middle" font-size="12" fill="#b91c1c">The model only picks tools and writes the explanation. Code makes the decision and builds the artifact.</text>
</svg>
